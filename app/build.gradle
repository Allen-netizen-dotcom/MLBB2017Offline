plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.mlbb2017.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mlbb2017.offline'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '2017.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
